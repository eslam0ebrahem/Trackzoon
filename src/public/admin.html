<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trackzoon - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-5px); }
        .sidebar { min-height: 100vh; background: #2c3e50; color: white; }
        .nav-link { color: rgba(255,255,255,0.8); }
        .nav-link:hover { color: white; background: rgba(255,255,255,0.1); }
        .nav-link.active { background: #3498db; color: white; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-3">
                <h4 class="mb-4"><i class="fas fa-robot"></i> Trackzoon</h4>
                <div class="nav flex-column">
                    <a href="#" class="nav-link active"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
                    <a href="/" class="nav-link"><i class="fas fa-home me-2"></i> Public Site</a>
                    <a href="#" class="nav-link" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <h2 class="mb-4">Admin Dashboard</h2>

                <!-- Stats Row -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card stat-card bg-primary text-white p-3">
                            <h5><i class="fas fa-users"></i> Total Users</h5>
                            <h2 id="totalUsers">-</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stat-card bg-success text-white p-3">
                            <h5><i class="fas fa-box"></i> Products</h5>
                            <h2 id="totalProducts">-</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stat-card bg-warning text-dark p-3">
                            <h5><i class="fas fa-bell"></i> Active Alerts</h5>
                            <h2 id="activeAlerts">-</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stat-card bg-info text-white p-3">
                            <h5><i class="fas fa-server"></i> System Uptime</h5>
                            <h2 id="uptime">-</h2>
                        </div>
                    </div>
                </div>

                <!-- Actions Row -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="card p-4">
                            <h4><i class="fas fa-sync"></i> System Actions</h4>
                            <hr>
                            <button class="btn btn-danger mb-3" onclick="forceScrape()">
                                <i class="fas fa-bolt"></i> Force Scrape All Prices
                            </button>
                            <p class="text-muted small">This will trigger a price check for ALL products immediately. Use with caution.</p>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card p-4">
                            <h4><i class="fas fa-broadcast-tower"></i> Broadcast Message</h4>
                            <hr>
                            <div class="mb-3">
                                <textarea id="broadcastMsg" class="form-control" rows="3" placeholder="Type message to send to all users..."></textarea>
                            </div>
                            <button class="btn btn-primary" onclick="sendBroadcast()">
                                <i class="fas fa-paper-plane"></i> Send Broadcast
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Auth Check
        const telegramId = localStorage.getItem('telegramId');
        if (!telegramId) {
            window.location.href = '/';
        }

        // Fetch Stats
        async function fetchStats() {
            try {
                const res = await fetch('/api/admin/stats', {
                    headers: { 'x-telegram-id': telegramId }
                });
                if (res.status === 403 || res.status === 401) {
                    alert('Unauthorized');
                    window.location.href = '/';
                    return;
                }
                const data = await res.json();
                
                document.getElementById('totalUsers').innerText = data.users;
                document.getElementById('totalProducts').innerText = data.products;
                document.getElementById('activeAlerts').innerText = data.activeAlerts;
                document.getElementById('uptime').innerText = (data.system.uptime / 3600).toFixed(1) + 'h';
            } catch (err) {
                console.error(err);
            }
        }

        // Force Scrape
        async function forceScrape() {
            const result = await Swal.fire({
                title: 'Are you sure?',
                text: "This will check prices for ALL products immediately.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, scrape it!'
            });

            if (result.isConfirmed) {
                try {
                    const res = await fetch('/api/admin/scrape-all', {
                        method: 'POST',
                        headers: { 'x-telegram-id': telegramId }
                    });
                    const data = await res.json();
                    Swal.fire('Started!', 'Scraping process has started.', 'success');
                } catch (err) {
                    Swal.fire('Error', 'Failed to start scraping', 'error');
                }
            }
        }

        // Broadcast
        async function sendBroadcast() {
            const message = document.getElementById('broadcastMsg').value;
            if (!message) return Swal.fire('Error', 'Please enter a message', 'error');

            const result = await Swal.fire({
                title: 'Send Broadcast?',
                text: "This message will be sent to ALL users.",
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Send'
            });

            if (result.isConfirmed) {
                try {
                    const res = await fetch('/api/admin/broadcast', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'x-telegram-id': telegramId 
                        },
                        body: JSON.stringify({ message })
                    });
                    const data = await res.json();
                    Swal.fire('Sent!', `Sent to ${data.sent} users. Failed: ${data.failed}`, 'success');
                    document.getElementById('broadcastMsg').value = '';
                } catch (err) {
                    Swal.fire('Error', 'Failed to send broadcast', 'error');
                }
            }
        }

        function logout() {
            localStorage.removeItem('telegramId');
            window.location.href = '/';
        }

        // Init
        fetchStats();
    </script>
</body>
</html>
