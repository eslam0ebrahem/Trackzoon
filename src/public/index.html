<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trackzoon Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Dark mode scrollbar */
        .dark ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #4b5563;
        }

        .dark ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* Ticker Animation */
        @keyframes ticker {
            0% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background-color: #2563eb;
            /* blue-600 */
            color: white;
            height: 32px;
            line-height: 32px;
        }

        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-right: 100%;
            animation: ticker 30s linear infinite;
        }

        .ticker:hover {
            animation-play-state: paused;
        }

        .ticker-item {
            display: inline-block;
            padding: 0 2rem;
            font-size: 0.875rem;
        }
    </style>
    <script>
        // Check local storage for theme
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 min-h-screen text-gray-800 dark:text-gray-100 transition-colors duration-200">

    <!-- Live Ticker -->
    <div class="ticker-wrap">
        <div class="ticker" id="priceTicker">
            <span class="ticker-item">Loading live prices...</span>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50 transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span
                        class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">Trackzoon</span>
                </div>

                <!-- Search Bar -->
                <div class="flex-1 max-w-lg mx-8 flex items-center">
                    <div class="relative w-full">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                        <input type="text" id="searchInput"
                            class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-full leading-5 bg-gray-50 dark:bg-gray-700 placeholder-gray-500 dark:placeholder-gray-400 text-gray-900 dark:text-white focus:outline-none focus:bg-white dark:focus:bg-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition"
                            placeholder="Search products...">
                        <!-- Search Results Dropdown -->
                        <div id="searchResults"
                            class="absolute mt-1 w-full bg-white dark:bg-gray-800 shadow-lg rounded-md py-1 text-base ring-1 ring-black ring-opacity-5 overflow-auto max-h-60 hidden z-50">
                            <!-- Results injected here -->
                        </div>
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    <!-- Health Status -->
                    <div id="healthStatus"
                        class="flex items-center space-x-2 px-3 py-1 rounded-full bg-gray-100 dark:bg-gray-700"
                        title="Checking system status...">
                        <div class="w-2 h-2 rounded-full bg-gray-400 animate-pulse"></div>
                        <span class="text-xs font-medium text-gray-500 dark:text-gray-400">System</span>
                    </div>

                    <!-- Dark Mode Toggle -->
                    <button id="themeToggle"
                        class="p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none">
                        <!-- Sun Icon -->
                        <svg id="sunIcon" class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                            </path>
                        </svg>
                        <!-- Moon Icon -->
                        <svg id="moonIcon" class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                            </path>
                        </svg>
                    </button>

                    <a href="https://t.me/TrackzoonBot" target="_blank"
                        class="bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-blue-700 transition shadow-md hover:shadow-lg transform hover:-translate-y-0.5">Open
                        Bot</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div
                class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6 border border-gray-100 dark:border-gray-700 transform hover:scale-105 transition duration-200">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Total Products</p>
                        <p class="text-2xl font-bold text-gray-900 dark:text-white" id="totalProducts">-</p>
                    </div>
                </div>
            </div>
            <div
                class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6 border border-gray-100 dark:border-gray-700 transform hover:scale-105 transition duration-200">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-green-100 dark:bg-green-900 text-green-600 dark:text-green-300">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                            </path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Active Users</p>
                        <p class="text-2xl font-bold text-gray-900 dark:text-white" id="totalUsers">-</p>
                    </div>
                </div>
            </div>
            <div
                class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6 border border-gray-100 dark:border-gray-700 transform hover:scale-105 transition duration-200">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-purple-100 dark:bg-purple-900 text-purple-600 dark:text-purple-300">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
                            </path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Tracked Items</p>
                        <p class="text-2xl font-bold text-gray-900 dark:text-white" id="totalTracked">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

            <!-- Left Column: Top Deals (6 cols) -->
            <div class="lg:col-span-6 space-y-8">
                <div
                    class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                    <div
                        class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 flex flex-col sm:flex-row justify-between items-center bg-gradient-to-r from-red-50 to-white dark:from-red-900/20 dark:to-gray-800 gap-4">
                        <div class="flex items-center">
                            <h2 class="text-lg font-bold text-gray-900 dark:text-white flex items-center">
                                <span class="mr-2">🔥</span> Top Global Deals
                            </h2>
                            <span
                                class="ml-3 text-xs font-medium bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200 px-2.5 py-0.5 rounded-full animate-pulse">Live</span>
                        </div>

                        <!-- Filters -->
                        <div class="flex space-x-2">
                            <button onclick="setFilter(0)" id="filter-0"
                                class="filter-btn px-3 py-1 text-xs font-medium rounded-full bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600 transition">All</button>
                            <button onclick="setFilter(10)" id="filter-10"
                                class="filter-btn px-3 py-1 text-xs font-medium rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition">>10%</button>
                            <button onclick="setFilter(25)" id="filter-25"
                                class="filter-btn px-3 py-1 text-xs font-medium rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition">>25%</button>
                            <button onclick="setFilter(50)" id="filter-50"
                                class="filter-btn px-3 py-1 text-xs font-medium rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition">>50%</button>
                        </div>
                    </div>
                    <div class="divide-y divide-gray-100 dark:divide-gray-700 max-h-[600px] overflow-y-auto"
                        id="dealsList">
                        <div class="p-8 text-center text-gray-500 dark:text-gray-400">Loading deals...</div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Chart & Recent Activity (6 cols) -->
            <div class="lg:col-span-6 space-y-8">

                <!-- Price Chart -->
                <div
                    class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-gray-900 dark:text-white flex items-center">
                            <span class="mr-2">📈</span> Price History
                        </h3>
                        <button id="compareBtn" onclick="toggleCompare()"
                            class="text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 px-3 py-1 rounded-md transition flex items-center mr-2">
                            <span class="mr-1">⚖️</span> Compare
                        </button>
                        <button id="downloadCsvBtn" onclick="downloadCSV()"
                            class="hidden text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 px-3 py-1 rounded-md transition flex items-center">
                            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            CSV
                        </button>
                    </div>
                    <div class="relative h-64 w-full">
                        <canvas id="priceChart"></canvas>
                    </div>
                    <div id="productInfo" class="mt-4 hidden animate-fade-in">
                        <h4 class="font-medium text-gray-900 dark:text-white truncate" id="chartTitle">Product Name</h4>
                        <div class="flex justify-between items-end mt-1">
                            <p class="text-2xl font-bold text-blue-600 dark:text-blue-400" id="chartPrice">EGP 0.00</p>
                            <a href="#" id="chartLink" target="_blank"
                                class="text-sm text-blue-500 hover:underline">View on Amazon &rarr;</a>
                        </div>
                    </div>
                </div>

                <!-- Recent Activity & Top Tracked Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

                    <!-- Merchant Distribution -->
                    <div
                        class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-4">
                        <h3 class="text-sm font-bold text-gray-700 dark:text-gray-200 mb-2">📊 Merchant Split</h3>
                        <div class="relative h-40 w-full">
                            <canvas id="merchantChart"></canvas>
                        </div>
                    </div>

                    <!-- Top Tracked -->
                    <div
                        class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                        <div
                            class="px-4 py-3 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-700">
                            <h3 class="text-sm font-bold text-gray-700 dark:text-gray-200">🏆 Most Popular</h3>
                        </div>
                        <div class="divide-y divide-gray-100 dark:divide-gray-700 max-h-40 overflow-y-auto"
                            id="topTracked">
                            <div class="p-4 text-center text-xs text-gray-400">Loading...</div>
                        </div>
                    </div>

                    <!-- Recent Activity (Full Width) -->
                    <div
                        class="sm:col-span-2 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                        <div
                            class="px-4 py-3 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-700">
                            <h3 class="text-sm font-bold text-gray-700 dark:text-gray-200">🕒 Recent Updates</h3>
                        </div>
                        <div class="divide-y divide-gray-100 dark:divide-gray-700 max-h-64 overflow-y-auto"
                            id="recentActivity">
                            <div class="p-4 text-center text-xs text-gray-400">Loading...</div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Theme Toggle Logic ---
        const themeToggle = document.getElementById('themeToggle');

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });

        // --- Chart Setup ---
        const ctx = document.getElementById('priceChart').getContext('2d');
        let priceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Price (EGP)',
                    data: [],
                    borderColor: 'rgb(37, 99, 235)',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    borderWidth: 2,
                    pointRadius: 3,
                    pointHoverRadius: 5,
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        beginAtZero: false,
                        grid: { borderDash: [2, 4], color: 'rgba(156, 163, 175, 0.2)' },
                        ticks: { color: 'rgb(156, 163, 175)' }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: 'rgb(156, 163, 175)' }
                    }
                }
            }
        });

        // Merchant Chart
        const merchantCtx = document.getElementById('merchantChart').getContext('2d');
        let merchantChart = new Chart(merchantCtx, {
            type: 'doughnut',
            data: {
                labels: [],
                datasets: [{
                    data: [],
                    backgroundColor: [
                        'rgba(59, 130, 246, 0.8)', // Blue
                        'rgba(16, 185, 129, 0.8)', // Green
                        'rgba(245, 158, 11, 0.8)', // Yellow
                        'rgba(239, 68, 68, 0.8)'   // Red
                    ],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'right', labels: { boxWidth: 10, font: { size: 10 } } }
                }
            }
        });

        async function fetchMerchantStats() {
            try {
                const res = await fetch('/api/stats/merchants');
                const data = await res.json();

                merchantChart.data.labels = data.labels;
                merchantChart.data.datasets[0].data = data.data;
                merchantChart.update();
            } catch (e) { console.error('Error fetching merchant stats:', e); }
        }

        // --- Data Fetching Functions ---

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('totalProducts').textContent = data.totalProducts;
                document.getElementById('totalUsers').textContent = data.totalUsers;
                document.getElementById('totalTracked').textContent = data.totalTrackedItems;
            } catch (e) { console.error('Error fetching stats:', e); }
        }

        let currentFilter = 0;
        let currentPage = 1;
        let isLoadingDeals = false;

        function setFilter(minDiscount) {
            currentFilter = minDiscount;
            currentPage = 1; // Reset page

            // Update UI
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-gray-200', 'dark:bg-gray-700', 'text-gray-700', 'dark:text-gray-300');
                btn.classList.add('bg-white', 'dark:bg-gray-800', 'text-gray-600', 'dark:text-gray-400', 'border');
            });

            const activeBtn = document.getElementById(`filter-${minDiscount}`);
            activeBtn.classList.remove('bg-white', 'dark:bg-gray-800', 'text-gray-600', 'dark:text-gray-400', 'border');
            activeBtn.classList.add('bg-gray-200', 'dark:bg-gray-700', 'text-gray-700', 'dark:text-gray-300');

            fetchDeals(1); // Reload deals
        }

        async function fetchDeals(page = 1) {
            if (isLoadingDeals) return;
            isLoadingDeals = true;
            currentPage = page;

            try {
                const res = await fetch(`/api/deals?page=${page}&limit=10`);
                const data = await res.json();
                let deals = data.items;
                const container = document.getElementById('dealsList');
                const loadMoreBtn = document.getElementById('loadMoreBtn');

                // Apply Filter (Client-side for now, ideally backend)
                if (currentFilter > 0) {
                    deals = deals.filter(d => d.percentChange >= currentFilter);
                }

                const html = deals.map(deal => `
                    <div class="p-4 hover:bg-gray-50 dark:hover:bg-gray-700 transition cursor-pointer group border-b border-gray-100 dark:border-gray-700" onclick="loadHistory('${deal.product.asin}')">
                        <div class="flex items-start space-x-4">
                            <div class="flex-shrink-0 w-16 h-16 bg-white dark:bg-gray-600 border border-gray-200 dark:border-gray-500 rounded-lg overflow-hidden flex items-center justify-center p-1">
                                ${deal.product.imageUrl ? `<img src="${deal.product.imageUrl}" class="w-full h-full object-contain">` : '<span class="text-2xl">📦</span>'}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start">
                                    <p class="text-sm font-medium text-gray-900 dark:text-white truncate pr-2 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition">${deal.product.name}</p>
                                    <div class="flex items-center space-x-2">
                                        <button onclick="event.stopPropagation(); shareDeal('${deal.product.name.replace(/'/g, "\\'")}', '${deal.product.url}', ${deal.currentPrice})" class="text-gray-400 hover:text-blue-500 transition">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                                        </button>
                                        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200">
                                            -${deal.percentChange.toFixed(0)}%
                                        </span>
                                    </div>
                                </div>
                                <div class="mt-1 flex items-baseline">
                                    <p class="text-lg font-bold text-gray-900 dark:text-white">EGP ${deal.currentPrice.toFixed(2)}</p>
                                    <p class="ml-2 text-xs text-gray-400 line-through">EGP ${deal.oldPrice.toFixed(2)}</p>
                                </div>
                                <div class="mt-1 flex items-center space-x-3 text-xs text-gray-500 dark:text-gray-400">
                                    ${deal.dealScore ? `<span class="flex items-center text-yellow-600 dark:text-yellow-400 font-medium">★ ${deal.dealScore}</span>` : ''}
                                    ${deal.trend ? `<span class="${deal.trend.trend === 'DOWN' ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}">
                                        ${deal.trend.trend === 'DOWN' ? '📉 Falling' : deal.trend.trend === 'UP' ? '📈 Rising' : '➡️ Stable'}
                                    </span>` : ''}
                                    ${(deal.statsAll && deal.currentPrice <= deal.statsAll.min) ?
                        `<span class="flex items-center text-purple-600 dark:text-purple-400 font-bold bg-purple-100 dark:bg-purple-900 px-1.5 rounded">🏆 ATL</span>`
                        : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');

                if (page === 1) {
                    container.innerHTML = html;
                    if (deals.length === 0) {
                        container.innerHTML = '<div class="p-8 text-center text-gray-500 dark:text-gray-400">No deals match your filter.</div>';
                    }
                    // Initial chart load
                    if (deals.length > 0 && priceChart.data.labels.length === 0) {
                        loadHistory(deals[0].product.asin);
                    }
                } else {
                    container.insertAdjacentHTML('beforeend', html);
                }

                // Handle Load More Button
                if (!loadMoreBtn) {
                    const btnHtml = `<div class="p-4 text-center"><button id="loadMoreBtn" onclick="fetchDeals(currentPage + 1)" class="text-sm text-blue-600 hover:underline">Load More</button></div>`;
                    container.parentElement.insertAdjacentHTML('beforeend', btnHtml);
                } else {
                    // If no more items, hide button
                    if (deals.length === 0 || page >= data.totalPages) {
                        loadMoreBtn.parentElement.style.display = 'none';
                    } else {
                        loadMoreBtn.parentElement.style.display = 'block';
                        loadMoreBtn.onclick = () => fetchDeals(page + 1);
                    }
                }

            } catch (e) { console.error('Error fetching deals:', e); } finally {
                isLoadingDeals = false;
            }
        }

        function shareDeal(name, url, price) {
            const text = `🔥 Check out this deal!\n${name}\nPrice: EGP ${price}\n${url}`;
            if (navigator.share) {
                navigator.share({
                    title: 'Trackzoon Deal',
                    text: text,
                    url: url
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    alert('Deal copied to clipboard!');
                }).catch(console.error);
            }
        }

        async function fetchRecent() {
            try {
                const res = await fetch('/api/recent');
                const products = await res.json();
                const container = document.getElementById('recentActivity');

                container.innerHTML = products.map(p => `
                    <div class="p-3 hover:bg-gray-50 dark:hover:bg-gray-700 transition cursor-pointer flex items-center justify-between" onclick="loadHistory('${p.asin}')">
                        <div class="flex items-center min-w-0">
                            <div class="w-2 h-2 rounded-full ${p.isOutOfStock ? 'bg-red-400' : 'bg-green-400'} mr-3"></div>
                            <div class="min-w-0">
                                <p class="text-xs font-medium text-gray-900 dark:text-white truncate w-32">${p.name}</p>
                                <p class="text-xs text-gray-500 dark:text-gray-400">${new Date(p.lastChecked).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</p>
                            </div>
                        </div>
                        <span class="text-xs font-bold text-gray-700 dark:text-gray-300">EGP ${p.currentPrice}</span>
                    </div>
                `).join('');

                updateTicker(products);
            } catch (e) { console.error('Error fetching recent:', e); }
        }

        function updateTicker(products) {
            const ticker = document.getElementById('priceTicker');
            if (!products || products.length === 0) return;

            ticker.innerHTML = products.map(p => `
                <span class="ticker-item cursor-pointer hover:underline" onclick="loadHistory('${p.asin}')">
                    ${p.isOutOfStock ? '🔴' : '🟢'} ${p.name.substring(0, 30)}... 
                    <span class="font-bold">EGP ${p.currentPrice}</span>
                </span>
            `).join('');
        }

        async function fetchTopTracked() {
            try {
                const res = await fetch('/api/top-tracked');
                const products = await res.json();
                const container = document.getElementById('topTracked');

                container.innerHTML = products.map((p, i) => `
                    <div class="p-3 hover:bg-gray-50 dark:hover:bg-gray-700 transition cursor-pointer flex items-center justify-between" onclick="loadHistory('${p.asin}')">
                        <div class="flex items-center min-w-0">
                            <span class="text-xs font-bold text-gray-400 mr-3 w-4">#${i + 1}</span>
                            <div class="min-w-0">
                                <p class="text-xs font-medium text-gray-900 dark:text-white truncate w-32">${p.name}</p>
                                <p class="text-xs text-blue-500">${p.trackerCount} trackers</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error('Error fetching top tracked:', e); }
        }

        let currentAsin = null;
        let isCompareMode = false;

        function toggleCompare() {
            isCompareMode = !isCompareMode;
            const btn = document.getElementById('compareBtn');
            if (isCompareMode) {
                btn.classList.add('bg-blue-100', 'text-blue-700', 'dark:bg-blue-900', 'dark:text-blue-300');
                btn.classList.remove('bg-gray-100', 'text-gray-600', 'dark:bg-gray-700', 'dark:text-gray-300');
            } else {
                btn.classList.remove('bg-blue-100', 'text-blue-700', 'dark:bg-blue-900', 'dark:text-blue-300');
                btn.classList.add('bg-gray-100', 'text-gray-600', 'dark:bg-gray-700', 'dark:text-gray-300');
                // Remove second dataset if exists
                if (priceChart.data.datasets.length > 1) {
                    priceChart.data.datasets.pop();
                    priceChart.update();
                }
            }
        }

        async function loadHistory(asin) {
            try {
                const res = await fetch(`/api/history/${asin}`);
                const data = await res.json();

                const labels = data.history.map(h => new Date(h.date).toLocaleDateString());
                const prices = data.history.map(h => h.price);

                if (isCompareMode && currentAsin && currentAsin !== asin) {
                    // Add as second dataset
                    // Note: This assumes labels (dates) match roughly, which might not be true. 
                    // For a simple implementation, we'll just push the data and let Chart.js handle it.
                    // A better way would be to merge time series, but that's complex.

                    // Check if we already have a second dataset
                    if (priceChart.data.datasets.length > 1) {
                        priceChart.data.datasets.pop(); // Remove previous comparison
                    }

                    priceChart.data.datasets.push({
                        label: data.name.substring(0, 20) + '...',
                        data: prices,
                        borderColor: 'rgb(220, 38, 38)', // Red
                        backgroundColor: 'rgba(220, 38, 38, 0.1)',
                        borderWidth: 2,
                        pointRadius: 3,
                        pointHoverRadius: 5,
                        tension: 0.4,
                        fill: false
                    });

                    priceChart.options.plugins.legend.display = true;
                    priceChart.update();

                } else {
                    // Normal Load (Replace)
                    currentAsin = asin;
                    document.getElementById('productInfo').classList.remove('hidden');
                    document.getElementById('downloadCsvBtn').classList.remove('hidden');
                    document.getElementById('chartTitle').textContent = data.name;
                    document.getElementById('chartPrice').textContent = `EGP ${data.currentPrice.toFixed(2)}`;
                    document.getElementById('chartLink').href = `https://www.amazon.eg/dp/${asin}`;

                    priceChart.data.labels = labels;
                    priceChart.data.datasets = [{
                        label: 'Price (EGP)',
                        data: prices,
                        borderColor: 'rgb(37, 99, 235)',
                        backgroundColor: 'rgba(37, 99, 235, 0.1)',
                        borderWidth: 2,
                        pointRadius: 3,
                        pointHoverRadius: 5,
                        tension: 0.4,
                        fill: true
                    }];
                    priceChart.options.plugins.legend.display = false;
                    priceChart.update();
                }
            } catch (e) { console.error('Error loading history:', e); }
        }

        async function downloadCSV() {
            if (!currentAsin) return;
            try {
                const res = await fetch(`/api/history/${currentAsin}`);
                const data = await res.json();

                if (!data.history || data.history.length === 0) return;

                // Create CSV content
                const headers = ['Date', 'Price (EGP)'];
                const rows = data.history.map(h => [
                    new Date(h.date).toISOString(),
                    h.price
                ]);

                const csvContent = [
                    headers.join(','),
                    ...rows.map(row => row.join(','))
                ].join('\n');

                // Create download link
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `price_history_${currentAsin}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (e) { console.error('Error downloading CSV:', e); }
        }

        // --- Search Functionality ---
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        let debounceTimer;

        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value;

            if (query.length < 2) {
                searchResults.classList.add('hidden');
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                    const results = await res.json();

                    if (results.length > 0) {
                        searchResults.innerHTML = results.map(p => `
                            <div class="px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer flex items-center justify-between" onclick="loadHistory('${p.asin}'); document.getElementById('searchResults').classList.add('hidden');">
                                <span class="text-sm text-gray-700 dark:text-gray-200 truncate w-64">${p.name}</span>
                                <span class="text-xs font-bold text-gray-500 dark:text-gray-400">EGP ${p.currentPrice}</span>
                            </div>
                        `).join('');
                        searchResults.classList.remove('hidden');
                    } else {
                        searchResults.innerHTML = '<div class="px-4 py-2 text-sm text-gray-500 dark:text-gray-400">No results found</div>';
                        searchResults.classList.remove('hidden');
                    }
                } catch (e) { console.error('Search error:', e); }
            }, 300);
        });

        // Close search on click outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });

        async function fetchHealth() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();

                const statusEl = document.getElementById('healthStatus');
                const dotEl = statusEl.querySelector('div');
                const textEl = statusEl.querySelector('span');

                if (data.status === 'ok') {
                    dotEl.classList.remove('bg-gray-400', 'bg-red-500', 'animate-pulse');
                    dotEl.classList.add('bg-green-500');
                    textEl.textContent = 'Online';

                    // Format uptime
                    const hours = Math.floor(data.uptime / 3600);
                    const minutes = Math.floor((data.uptime % 3600) / 60);
                    statusEl.title = `Uptime: ${hours}h ${minutes}m | Memory: ${data.memory.heapUsed}`;
                } else {
                    throw new Error('Status not ok');
                }
            } catch (e) {
                console.error('Error fetching health:', e);
                const statusEl = document.getElementById('healthStatus');
                const dotEl = statusEl.querySelector('div');
                const textEl = statusEl.querySelector('span');

                dotEl.classList.remove('bg-gray-400', 'bg-green-500', 'animate-pulse');
                dotEl.classList.add('bg-red-500');
                textEl.textContent = 'Offline';
            }
        }

        // --- Init ---
        function init() {
            fetchStats();
            fetchDeals();
            fetchRecent();
            fetchTopTracked();
            fetchHealth();
            fetchMerchantStats();
        }

        init();
        setInterval(init, 60000); // Refresh every minute

    </script>
</body>
