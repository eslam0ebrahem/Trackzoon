<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trackzoon Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">Trackzoon</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="#" class="text-gray-600 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">Dashboard</a>
                    <a href="https://t.me/TrackzoonBot" target="_blank" class="bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-blue-700 transition">Open Bot</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">Total Products</p>
                        <p class="text-2xl font-bold text-gray-900" id="totalProducts">-</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-green-100 text-green-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">Active Users</p>
                        <p class="text-2xl font-bold text-gray-900" id="totalUsers">-</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-purple-100 text-purple-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">Tracked Items</p>
                        <p class="text-2xl font-bold text-gray-900" id="totalTracked">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Top Deals List -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                        <h2 class="text-lg font-bold text-gray-900">🔥 Top Global Deals</h2>
                        <span class="text-xs font-medium bg-red-100 text-red-800 px-2.5 py-0.5 rounded-full">Live Updates</span>
                    </div>
                    <div class="divide-y divide-gray-100" id="dealsList">
                        <!-- Deals will be injected here -->
                        <div class="p-8 text-center text-gray-500">Loading deals...</div>
                    </div>
                </div>
            </div>

            <!-- Price Chart Preview -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 sticky top-24">
                    <h3 class="text-lg font-bold text-gray-900 mb-4">Price History</h3>
                    <p class="text-sm text-gray-500 mb-4">Click on a deal to view its price history.</p>
                    <div class="relative h-64 w-full">
                        <canvas id="priceChart"></canvas>
                    </div>
                    <div id="productInfo" class="mt-4 hidden">
                        <h4 class="font-medium text-gray-900 truncate" id="chartTitle">Product Name</h4>
                        <p class="text-2xl font-bold text-blue-600 mt-1" id="chartPrice">EGP 0.00</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Chart
        const ctx = document.getElementById('priceChart').getContext('2d');
        let priceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Price (EGP)',
                    data: [],
                    borderColor: 'rgb(37, 99, 235)',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: { beginAtZero: false }
                }
            }
        });

        // Fetch Stats
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('totalProducts').textContent = data.totalProducts;
                document.getElementById('totalUsers').textContent = data.totalUsers;
                document.getElementById('totalTracked').textContent = data.totalTrackedItems;
            } catch (e) {
                console.error('Error fetching stats:', e);
            }
        }

        // Fetch Deals
        async function fetchDeals() {
            try {
                const res = await fetch('/api/deals');
                const deals = await res.json();
                const container = document.getElementById('dealsList');
                
                if (deals.length === 0) {
                    container.innerHTML = '<div class="p-8 text-center text-gray-500">No active deals right now.</div>';
                    return;
                }

                container.innerHTML = deals.map((deal, index) => `
                    <div class="p-4 hover:bg-gray-50 transition cursor-pointer group" onclick="loadHistory('${deal.product.asin}')">
                        <div class="flex items-start space-x-4">
                            <div class="flex-shrink-0 w-16 h-16 bg-gray-100 rounded-lg overflow-hidden flex items-center justify-center">
                                ${deal.product.imageUrl ? `<img src="${deal.product.imageUrl}" class="w-full h-full object-contain">` : '<span class="text-2xl">📦</span>'}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between">
                                    <p class="text-sm font-medium text-gray-900 truncate pr-4 group-hover:text-blue-600 transition">${deal.product.name}</p>
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                        -${deal.percentChange.toFixed(0)}%
                                    </span>
                                </div>
                                <div class="mt-1 flex items-baseline">
                                    <p class="text-lg font-bold text-gray-900">EGP ${deal.currentPrice.toFixed(2)}</p>
                                    <p class="ml-2 text-sm text-gray-500 line-through">EGP ${deal.oldPrice.toFixed(2)}</p>
                                </div>
                                <div class="mt-2 flex items-center space-x-4 text-xs text-gray-500">
                                    ${deal.dealScore ? `<span class="flex items-center text-yellow-600 font-medium">★ Score: ${deal.dealScore}</span>` : ''}
                                    ${deal.trend ? `<span class="flex items-center ${deal.trend.trend === 'DOWN' ? 'text-green-600' : 'text-red-600'}">
                                        ${deal.trend.trend === 'DOWN' ? '📉 Falling' : deal.trend.trend === 'UP' ? '📈 Rising' : '➡️ Stable'}
                                    </span>` : ''}
                                    <span>Low: ${deal.stats30d?.min || '-'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');

                // Load first deal history automatically
                if (deals.length > 0) {
                    loadHistory(deals[0].product.asin);
                }

            } catch (e) {
                console.error('Error fetching deals:', e);
                document.getElementById('dealsList').innerHTML = '<div class="p-8 text-center text-red-500">Error loading deals.</div>';
            }
        }

        // Load History for Chart
        async function loadHistory(asin) {
            try {
                const res = await fetch(`/api/history/${asin}`);
                const data = await res.json();
                
                document.getElementById('productInfo').classList.remove('hidden');
                document.getElementById('chartTitle').textContent = data.name;
                document.getElementById('chartPrice').textContent = `EGP ${data.currentPrice.toFixed(2)}`;

                const labels = data.history.map(h => new Date(h.date).toLocaleDateString());
                const prices = data.history.map(h => h.price);

                priceChart.data.labels = labels;
                priceChart.data.datasets[0].data = prices;
                priceChart.update();

            } catch (e) {
                console.error('Error loading history:', e);
            }
        }

        // Initial Load
        fetchStats();
        fetchDeals();

        // Refresh every minute
        setInterval(() => {
            fetchStats();
            fetchDeals();
        }, 60000);

    </script>
</body>
</html>
